name: P_app
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-papp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-papp}
      POSTGRES_DB: ${POSTGRES_DB:-papp}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - papp_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-papp} -d ${POSTGRES_DB:-papp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-papp}:${POSTGRES_PASSWORD:-papp}@db:5432/${POSTGRES_DB:-papp}?schema=public
      PORT: ${PORT:-3000}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set — see .env.example}
      # Must match WEB_PORT (see the `web` service below) or every browser
      # request fails CORS — main.ts falls back to http://localhost:5173
      # ONLY when this is entirely unset, which no longer matches once
      # WEB_PORT is changed from its own default.
      WEB_ORIGIN: ${WEB_ORIGIN:-}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # Notification Center email channel (all optional — when SMTP_HOST is
      # unset the api logs rendered mail instead of delivering it).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Database backup/restore (docs/DECISIONS.md D43 resolution): AES-256
      # encryption key for the exported backup archive. Empty (default) means
      # the feature reports itself as unconfigured — same disabled-by-default
      # stance as SMTP_HOST above, not an admin-tunable system_settings value
      # (it's a secret, same category as JWT_SECRET).
      BACKUP_ENCRYPTION_PASSWORD: ${BACKUP_ENCRYPTION_PASSWORD:-}
      # Survey module pictures (SURVEY-D18): files live in the named volume below, NOT in the
      # database, so the database backup does not contain them — back this volume up as well.
      SURVEY_MEDIA_DIR: /data/survey-media
      # Library Catalog book covers and book files (see ./books_files below).
      BOOK_FILES_DIR: /data/books_files
      # Directories the admin "Export files" backup archives (name=path, comma separated). The database
      # export does NOT contain uploaded files; a module that stores files must be listed here.
      BACKUP_FILE_DIRS: books_files=/data/books_files,survey_media=/data/survey-media
    ports:
      - "${API_HOST_PORT:-3000}:3000"
    volumes:
      # Dev convenience: bind-mounts the host's modules/ straight over the
      # image's own baked-in copy (see apps/api/Dockerfile's `COPY modules
      # modules`) so an edited manifest.json/backend/**/*.js is visible to
      # the container immediately, with no `docker compose build`. This does
      # NOT make a change take effect by itself — main.ts only discovers/
      # imports modules once at boot (D15), and Node has already loaded
      # whatever .js it imported — an edited module's code still needs
      # `docker compose restart api` (see the Modules page's own note for
      # the full picture, incl. why a FRONTEND module edit needs a real
      # `docker compose build web` regardless of this mount).
      - ./modules:/repo/modules
      # Theme packs are read on demand: drop a folder in, no restart needed.
      - ./themes:/repo/themes
      - papp_survey_media:/data/survey-media
      # Book covers/files: a host folder (not tracked by git) so the files can be browsed, backed up
      # and copied by hand: ./books_files/<book id>/{cover.*, book.*, info.txt}.
      - ./books_files:/data/books_files
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-5173}:80"

volumes:
  papp_db_data:
  papp_survey_media:
