# Core api route prefixes (kept in sync with vite.config.ts's
# CORE_API_PATH_PREFIXES — same list, same reason it exists: these paths are
# IDENTICAL, by design, to this SPA's own client-side routes (no "/api"
# prefix on the backend), so routing can't be a bare "proxy everything" —
# it has to tell a real page navigation (Accept: text/html) apart from an
# XHR/fetch call (axios/fetch never send that Accept) and only proxy the
# latter to the api. `map` turns that header into a flag once, cheaply;
# `server{}` then uses a single scoped `if (...) { rewrite ... last; }` to
# bail out to the SPA shell — `last` restarts location matching against
# /index.html so it actually hits `location /` below, unlike `break` (which
# would NOT exit this block and fall through into proxy_pass here).
map $http_accept $wants_html {
    default       0;
    "~*text/html" 1;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback: any unknown path, or a real page navigation to one of
    # the dual-purpose prefixes below, serves index.html so React Router
    # handles it client-side.
    # Vite's content-hashed bundles: safe to cache forever.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
        # Page URLs and api URLs are identical (/users, /modules, ...): without
        # this, a browser caches the HTML shell fetched on a reload under e.g.
        # /modules and then serves it to the app's own JSON call to /modules.
        add_header Vary Accept always;
        add_header Cache-Control "no-cache" always;
    }

    # Dual-purpose prefixes: real page navigation -> SPA index.html (via the
    # rewrite below); XHR/fetch (non-HTML Accept) -> reverse proxy to the
    # `api` service (docker-compose network name, its own internal PORT —
    # never a host-published port; see docker-compose.yml's `api` service).
    location ~ ^/(auth|users|roles|permissions|sessions|audit|notifications|settings|modules|i18n|health|backup)(/.*)?$ {
        if ($wants_html = 1) {
            rewrite ^ /index.html last;
        }

        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        add_header Vary Accept always;
        add_header Cache-Control "no-store" always;
    }

    # Every installable module mounts its backend controllers under this
    # one fixed "api/..." prefix (unlike core, which has no such prefix —
    # see the block above) — confirmed universal across every module in
    # modules/*/backend/*.controller.ts as of this writing. No per-module
    # list to maintain here: a new module's routes work automatically the
    # moment its backend controller exists, with zero edits to this file.
    # Unlike the core prefixes above, "api/..." is never also a client-side
    # SPA route (module frontend routes mount bare, e.g.
    # /library-circulation/students, never /api/library-circulation/...),
    # so this is an unconditional proxy — no Accept-based branching needed.
    location /api/ {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}
